<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>mailamb — 参考テンプレート</title>
<link rel="stylesheet" href="panel.css">
<style>
  html, body { min-width: 760px; width: 760px; min-height: 640px; }
  .doc-meta { background: var(--accent-weak); color: var(--accent); padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; font-size: 12px; }
  .doc-meta strong { color: var(--fg); }
  .doc-title { font-size: 16px; font-weight: 700; margin: 8px 0 6px; }
  .doc-body { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 16px 20px; font: 13px/1.75 -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; max-height: 520px; overflow-y: auto; }
  .doc-body h1 { font-size: 17px; margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .doc-body h2 { font-size: 15px; margin: 16px 0 8px; color: var(--accent); }
  .doc-body h3 { font-size: 13px; margin: 12px 0 6px; }
  .doc-body h1:first-child, .doc-body h2:first-child, .doc-body h3:first-child { margin-top: 0; }
  .doc-body p { margin: 0 0 10px; }
  .doc-body ol, .doc-body ul { margin: 0 0 10px; padding-left: 22px; }
  .doc-body li { margin: 3px 0; }
  .doc-body code { background: var(--accent-weak); padding: 1px 5px; border-radius: 3px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent); }
  .doc-body strong { color: var(--fg); font-weight: 700; }
  .doc-tag { display: inline-block; padding: 1px 7px; background: var(--border); color: var(--muted); border-radius: 8px; font-size: 11px; margin-right: 4px; }
</style>
</head>
<body>
  <div id="status" class="status">読み込み中...</div>
  <div id="meta" class="doc-meta" hidden></div>
  <div id="title" class="doc-title" hidden></div>
  <div id="body" class="doc-body" hidden></div>
  <script src="doc.js"></script>
</body>
</html>
