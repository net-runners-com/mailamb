<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>mailamb</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="head">
    <div class="title">🤖 AI下書き</div>
    <div class="status" id="status">読み込み中...</div>
  </div>

  <div id="meta" class="meta" hidden></div>

  <div id="stateBadge" class="state-badge" hidden></div>
  <div id="viewsBadge" class="views-badge" hidden></div>

  <div id="retrievedBlock" class="section" hidden>
    <div class="label">参考テンプレート</div>
    <div id="retrieved"></div>
  </div>

  <div id="warnBlock" class="warn" hidden></div>

  <div id="draftBlock" class="section" hidden>
    <div class="label">下書き</div>
    <textarea id="draft" rows="22"></textarea>
  </div>

  <div class="actions" id="actionsBlock" hidden>
    <label for="fromSelect">差出人:</label>
    <select id="fromSelect"></select>
    <button id="reply">下書きで返信</button>
    <button id="saveDraft" class="secondary">Draftsに保存</button>
    <button id="copy" class="secondary">本文コピー</button>
    <button id="markReplied" class="secondary">送信済にする</button>
  </div>

  <div class="footer">
    <a href="#" id="openOptions">設定</a>
  </div>

  <script src="panel.js"></script>
</body>
</html>
