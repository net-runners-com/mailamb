<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>mailamb 送信確認</title>
<style>
  html, body { min-width: 480px; width: 480px; min-height: 200px; margin: 0; }
  body {
    padding: 20px 24px 16px;
    font: 14px/1.5 -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    background: #fff; color: #1a2024;
    display: flex; flex-direction: column; justify-content: space-between; min-height: 180px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1f26; color: #e5e7eb; }
  }
  .title { font-weight: 700; font-size: 16px; margin: 0 0 10px; color: #d49a00; }
  .msg { white-space: pre-wrap; margin: 0 0 18px; line-height: 1.6; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; }
  button {
    padding: 7px 16px; border-radius: 4px; border: 1px solid #2a7fb8;
    background: #2a7fb8; color: #fff; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  button.cancel { background: transparent; color: #2a7fb8; }
  button.danger { background: #c3443e; border-color: #c3443e; }
  button:hover { opacity: 0.85; }
</style>
</head>
<body>
  <div>
    <div class="title">⚠️ 送信確認</div>
    <p class="msg" id="msg">...</p>
  </div>
  <div class="actions">
    <button id="cancel" class="cancel">キャンセル</button>
    <button id="ok" class="danger">それでも送信</button>
  </div>
  <script src="confirm.js"></script>
</body>
</html>
