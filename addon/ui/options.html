<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>mailamb 設定</title>
<link rel="stylesheet" href="panel.css">
</head>
<body style="width:420px">
  <div class="title">mailamb 設定</div>

  <div class="section">
    <div class="label">Worker URL</div>
    <input id="workerUrl" type="text" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--fg);">
  </div>

  <div class="section">
    <div class="label">API Key (X-API-Key)</div>
    <input id="apiKey" type="password" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--fg);">
  </div>

  <div class="section">
    <div class="label">スタッフID (共有メール運用で誰が返信中/送信済かを区別)</div>
    <input id="staffId" type="text" placeholder="例: tanaka, SK など" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--fg);">
  </div>

  <div class="section">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
      <input id="enableAutoDraft" type="checkbox" style="width:auto;margin:0;">
      <span>新着メール受信時に AI下書きを自動で Draftsフォルダに保存する</span>
    </label>
    <div class="label" style="margin-top:4px;font-weight:400;">
      オフ: パネルの「Draftsに保存」ボタンで手動保存のみ
    </div>
  </div>

  <div class="section">
    <div class="label">問い合わせ宛先（カンマ区切り）</div>
    <input id="inquiryAddresses" type="text" placeholder="例: info@yourcompany.com,contact@yourcompany.com" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--fg);">
    <div class="label" style="margin-top:4px;font-weight:400;">
      ここに書いた宛先に届いたメールだけ自動下書きする。空欄なら「広告・通知メール」を自動除外する簡易判定のみ。
    </div>
  </div>

  <div class="actions" style="border-top:none">
    <button id="save">保存</button>
    <span id="msg" class="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
