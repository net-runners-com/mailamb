name = "mailamb-email"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# fetchハンドラも持たせる（デバッグ用GET /health）
[placement]
mode = "smart"

# mailamb Worker にService Bindingで繋ぐ（API Key不要・内部通信）
[[services]]
binding = "MAILAMB"
service = "mailamb"

# 本番運用で生成失敗時でも転送を優先するかなど制御
[vars]
# スタッフ転送先（カンマ区切り）
# ※ message.forward() は Email Routing の verified destination にしか送れない
# PoCではGmailのみverified → 1宛先。本番で各スタッフGmailを verified に追加する
FORWARD_TO = "forward@example.com"
# フォールバック: AI生成失敗しても転送だけ継続
FAIL_OPEN = "true"

[observability]
enabled = true
