<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mailamb 管理 (minimal)</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="topbar">
  <div class="brand">mailamb <span class="sub">管理画面 (minimal)</span></div>
  <nav class="tabs">
    <button class="tab active" data-tab="knowledge">ナレッジ管理</button>
    <button class="tab" data-tab="sent">送信履歴</button>
    <button class="tab" data-tab="settings">設定</button>
  </nav>
  <div class="connection">
    <span id="connStatus" class="dot pending"></span>
    <span id="connLabel">接続確認中</span>
    <button id="refreshBtn" class="small">更新</button>
  </div>
</header>

<main>

<section id="pane-knowledge" class="pane active">
  <div class="pane-header">
    <h2>ナレッジ管理</h2>
    <button id="addKnowledgeBtn" class="primary">+ 新規追加</button>
  </div>
  <div id="knowledgeForm" class="form-card" hidden>
    <h3>新規ドキュメント</h3>
    <div class="row">
      <label>doc_id<input id="k_doc_id" placeholder="tpl-xxx-001"></label>
      <label>タイプ
        <select id="k_type">
          <option value="template">template (定型文)</option>
          <option value="past_case">past_case (過去対応)</option>
          <option value="policy">policy (方針)</option>
          <option value="reference">reference (参考資料)</option>
        </select>
      </label>
    </div>
    <label>タイトル<input id="k_title" placeholder="例: 新規見積(コーポレート)返信テンプレ"></label>
    <div class="row">
      <label>カテゴリ<input id="k_category" placeholder="例: estimate"></label>
      <label>タグ (カンマ区切り)<input id="k_tags" placeholder="見積, コーポレート, 新規"></label>
    </div>
    <label>本文 (Markdown可)<textarea id="k_content" rows="10" placeholder="問い合わせへの返信文、または参照したい社内情報"></textarea></label>
    <div class="actions">
      <button id="k_save" class="primary">保存</button>
      <button id="k_cancel" class="secondary">キャンセル</button>
      <span id="k_msg" class="msg"></span>
    </div>
  </div>
  <table class="knowledge">
    <thead>
      <tr>
        <th>doc_id</th>
        <th>タイプ</th>
        <th>タイトル</th>
        <th>カテゴリ</th>
        <th>更新</th>
        <th>有効</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="knowledgeBody">
      <tr><td colspan="7" class="empty">—</td></tr>
    </tbody>
  </table>
</section>

<section id="pane-sent" class="pane">
  <div class="pane-header">
    <h2>送信履歴</h2>
    <div class="meta" id="sentMeta">—</div>
  </div>
  <table class="activity">
    <thead>
      <tr>
        <th>日時</th>
        <th>Message-ID</th>
        <th>状態</th>
        <th>スタッフ</th>
      </tr>
    </thead>
    <tbody id="sentBody">
      <tr><td colspan="4" class="empty">設定を入力してください</td></tr>
    </tbody>
  </table>
</section>

<section id="pane-settings" class="pane">
  <h2>設定</h2>
  <div class="form-card">
    <label>Worker URL<input id="s_url" placeholder="https://mailamb.example.workers.dev"></label>
    <label>API Key<input id="s_key" type="password"></label>
    <div class="actions">
      <button id="s_save" class="primary">保存</button>
      <span id="s_msg" class="msg"></span>
    </div>
    <p class="hint">
      設定はこのブラウザのローカルストレージに保存されます。他のPCで使う時は再度入力してください。
    </p>
  </div>
</section>

</main>

<script src="admin.js"></script>
</body>
</html>
