<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mailamb PoC — 下書き生成テスト</title>
<style>
  :root {
    --bg: #f8f9fb;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --card: #ffffff;
    --accent: #2a7fb8;
    --accent-weak: #e1f0fa;
    --warn: #d49a00;
    --warn-weak: #fff4e1;
    --ok: #2e7d32;
    --ok-weak: #e8f5e9;
    --skip: #9ca3af;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --border: #27303d;
      --card: #171a21;
      --accent: #4aa3d5;
      --accent-weak: #1a2a38;
      --warn: #e3b43b;
      --warn-weak: #3a2f12;
      --ok: #86d894;
      --ok-weak: #1a2e1d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 14px;
    line-height: 1.6;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 16px;
    align-items: baseline;
    background: var(--card);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px;
    max-width: 1600px;
    margin: 0 auto;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .card h2 {
    font-size: 13px;
    margin: 0 0 12px 0;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 10px 0 4px 0;
    font-weight: 500;
  }
  input[type="text"], input[type="email"], input[type="number"], textarea, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    font-family: inherit;
    font-size: 13px;
  }
  textarea { resize: vertical; font-family: var(--mono); font-size: 12.5px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  button {
    padding: 10px 16px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--accent);
  }
  .toolbar {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    background: var(--accent-weak);
    color: var(--accent);
  }
  .pill.ok { background: var(--ok-weak); color: var(--ok); }
  .pill.warn { background: var(--warn-weak); color: var(--warn); }
  .pill.skip { background: var(--border); color: var(--skip); }
  .mono { font-family: var(--mono); font-size: 12px; }
  pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--bg);
    padding: 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    margin: 0;
  }
  .hit {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    margin: 6px 0;
    background: var(--bg);
  }
  .hit .head {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
  }
  .hit .title { flex: 1; font-weight: 500; }
  .hit .score {
    font-family: var(--mono);
    color: var(--accent);
    font-weight: 600;
  }
  .status { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .error { color: #d14343; }
  details { margin-top: 10px; }
  details summary { cursor: pointer; font-size: 12px; color: var(--muted); font-weight: 500; }
  .collapsed-row { margin-top: 8px; }
  .warn-banner {
    background: var(--warn-weak);
    color: var(--warn);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    margin: 8px 0;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<header>
  <h1>mailamb PoC</h1>
  <span class="sub">当社 メール下書き生成テスト</span>
  <span class="sub" id="idx-info"></span>
</header>

<main>
  <section class="card">
    <h2>入力</h2>

    <label for="sample">サンプルから読み込み</label>
    <select id="sample">
      <option value="">— 選択 —</option>
    </select>

    <label for="subject">件名</label>
    <input type="text" id="subject" placeholder="お問い合わせ件名">

    <div class="row">
      <div>
        <label for="fromName">差出人名</label>
        <input type="text" id="fromName" placeholder="山田 太郎">
      </div>
      <div>
        <label for="fromEmail">差出人メール</label>
        <input type="email" id="fromEmail" placeholder="yamada@example.com">
      </div>
    </div>

    <label for="body">本文</label>
    <textarea id="body" rows="12" placeholder="お問い合わせ本文..."></textarea>

    <details>
      <summary>詳細設定（モデル・RAG）</summary>
      <div class="collapsed-row">
        <div class="row-3">
          <div>
            <label for="model">LLM</label>
            <select id="model">
              <option value="">デフォルト (llama-3.3-70b)</option>
              <option value="@cf/meta/llama-3.3-70b-instruct-fp8-fast">llama-3.3-70b-fast</option>
              <option value="@cf/qwen/qwen2.5-coder-32b-instruct">qwen2.5-32b</option>
              <option value="@cf/meta/llama-4-scout-17b-16e-instruct">llama-4-scout-17b</option>
            </select>
          </div>
          <div>
            <label for="threshold">閾値 (cos)</label>
            <input type="number" id="threshold" step="0.05" min="0" max="1" value="0.5">
          </div>
          <div>
            <label for="topK">top-k</label>
            <input type="number" id="topK" min="1" max="10" value="5">
          </div>
        </div>
        <div class="row">
          <div>
            <label for="temperature">temperature</label>
            <input type="number" id="temperature" step="0.1" min="0" max="1" value="0.3">
          </div>
          <div>
            <label for="skipPre"><input type="checkbox" id="skipPre"> 前処理フィルタをスキップ</label>
          </div>
        </div>
        <label for="systemPrompt">システムプロンプト（空＝デフォルト）</label>
        <textarea id="systemPrompt" rows="4" placeholder="空の場合はデフォルトの当社向けプロンプトを使用"></textarea>
      </div>
    </details>

    <div class="toolbar">
      <button id="run">生成</button>
      <button class="secondary" id="clear">クリア</button>
      <span class="status" id="status"></span>
    </div>
  </section>

  <section class="card">
    <h2>結果</h2>
    <div id="result-head"></div>
    <div id="warn"></div>

    <div id="intent-block" style="display:none">
      <label>抽出された意図</label>
      <pre id="intent"></pre>
    </div>

    <div id="hits-block" style="display:none">
      <label>RAG ヒット (top-k)</label>
      <div id="hits"></div>
    </div>

    <div id="draft-block" style="display:none">
      <label>AI下書き</label>
      <pre id="draft"></pre>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let samples = [];

async function loadData() {
  const res = await fetch("/api/data");
  const data = await res.json();
  samples = data.inquiries;
  $("idx-info").textContent = `index: ${data.indexCount} 件 (templates: ${data.templates.length}, past_cases: ${data.pastCases.length})`;
  const sel = $("sample");
  for (const inq of samples) {
    const opt = document.createElement("option");
    opt.value = inq.id;
    opt.textContent = `${inq.id} — ${inq.expected_category}`;
    sel.appendChild(opt);
  }
}

$("sample").addEventListener("change", (e) => {
  const inq = samples.find((s) => s.id === e.target.value);
  if (!inq) return;
  $("subject").value = inq.subject;
  $("fromName").value = inq.from.name;
  $("fromEmail").value = inq.from.email;
  let bodyText = inq.body;
  if (inq.thread_history?.length) {
    bodyText = "[参考: スレッド履歴あり — 本文のみ使用]\n\n" + bodyText;
  }
  $("body").value = bodyText;
});

$("clear").addEventListener("click", () => {
  $("sample").value = "";
  $("subject").value = "";
  $("fromName").value = "";
  $("fromEmail").value = "";
  $("body").value = "";
  $("intent-block").style.display = "none";
  $("hits-block").style.display = "none";
  $("draft-block").style.display = "none";
  $("result-head").innerHTML = "";
  $("warn").innerHTML = "";
});

$("run").addEventListener("click", async () => {
  const btn = $("run");
  btn.disabled = true;
  $("status").textContent = "生成中... (10〜30秒かかります)";
  $("status").className = "status";
  $("result-head").innerHTML = "";
  $("warn").innerHTML = "";

  const sampleId = $("sample").value;
  const sample = samples.find((s) => s.id === sampleId);

  const payload = {
    id: sampleId || "custom",
    subject: $("subject").value,
    from: { name: $("fromName").value, email: $("fromEmail").value },
    body: $("body").value,
    thread_history: sample?.thread_history,
    attachments: sample?.attachments ?? [],
    expected_category: sample?.expected_category ?? "",
    threshold: parseFloat($("threshold").value),
    topK: parseInt($("topK").value, 10),
    model: $("model").value || undefined,
    temperature: parseFloat($("temperature").value),
    systemPromptOverride: $("systemPrompt").value || undefined,
    skipPrefilter: $("skipPre").checked,
  };

  const t0 = performance.now();
  try {
    const res = await fetch("/api/draft", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const r = await res.json();
    const elapsed = Math.round(performance.now() - t0);

    if (r.error) {
      $("status").textContent = `エラー: ${r.error}`;
      $("status").className = "status error";
      return;
    }

    const head = [];
    if (r.skip) {
      head.push(`<span class="pill skip">SKIP</span> <span class="mono">${r.skip_reason ?? ""}</span>`);
    } else {
      head.push(`<span class="pill ok">生成OK</span> <span class="mono">${r.elapsed_ms}ms (サーバー) / ${elapsed}ms (全体)</span>`);
    }
    $("result-head").innerHTML = head.join(" ");

    if (r.attachment_warning) {
      $("warn").innerHTML = `<div class="warn-banner">${r.attachment_warning}</div>`;
    }

    if (r.skip) {
      $("intent-block").style.display = "none";
      $("hits-block").style.display = "none";
      $("draft-block").style.display = "none";
      $("status").textContent = "";
      return;
    }

    $("intent").textContent = r.intent ?? "";
    $("intent-block").style.display = "block";

    const hitsEl = $("hits");
    hitsEl.innerHTML = "";
    if (!r.retrieved?.length) {
      hitsEl.innerHTML = `<div class="hit"><div class="head"><span class="pill warn">閾値超えなし</span><span class="title">フォールバック対応</span></div></div>`;
    } else {
      for (const h of r.retrieved) {
        const el = document.createElement("div");
        el.className = "hit";
        el.innerHTML = `<div class="head">
          <span class="pill">${h.type}</span>
          <span class="title">${h.title}</span>
          <span class="score">${h.score.toFixed(3)}</span>
        </div>
        <div class="mono" style="color:var(--muted);margin-top:4px">${h.id}</div>`;
        hitsEl.appendChild(el);
      }
    }
    $("hits-block").style.display = "block";

    $("draft").textContent = r.draft ?? "";
    $("draft-block").style.display = "block";
    $("status").textContent = "";
  } catch (e) {
    $("status").textContent = `エラー: ${e.message}`;
    $("status").className = "status error";
  } finally {
    btn.disabled = false;
  }
});

loadData();
</script>

</body>
</html>
