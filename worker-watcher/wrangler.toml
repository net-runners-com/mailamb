name = "mailamb-watcher"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Service binding to mailamb Worker (AI生成API)
[[services]]
binding = "MAILAMB"
service = "mailamb"

# 毎分1回、55秒IDLE窓を開く
[triggers]
crons = ["* * * * *"]

[vars]
# IDLE保持時間 (ms)。cron 60秒間隔に対して少し短めで必ず終わらせる。
IDLE_DURATION_MS = "55000"

[observability]
enabled = true
